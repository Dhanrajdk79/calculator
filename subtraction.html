
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtraction Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="subtraction">
    <header>
        <h1>Subtraction Calculator</h1>
        <a href="index.html">← Back to Home</a>
    </header>


<main class="calculator-container">
    <div class="calculator-card">
        <div class="calculator-icon">＋</div>

        <h2>Subtraction Calculator</h2>
        <p class="subtitle">Enter your numbers and calculate instantly.</p>

        <form id="calculator-form">
            <label for="num1">First number</label>
            <input type="number" id="num1" step="any"
                   placeholder="Enter first number" required>

            <label for="num2">Second number</label>
            <input type="number" id="num2" step="any"
                   placeholder="Enter second number" required>

            <button type="submit" id="calculate">Calculate Result</button>
            <button type="reset" id="reset" class="secondary-btn">
                Clear
            </button>
        </form>

        <div class="result-box">
            <span class="result-label">YOUR RESULT</span>
            <p id="result" aria-live="polite">Your answer will appear here</p>
            <button type="button" id="copy-result" class="copy-btn">
                Copy Result
            </button>
        </div>

        <section class="history-section">
            <h3>Recent Calculations</h3>
            <ul id="history"></ul>
        </section>

        <a class="back-link" href="index.html">← Back to Home</a>
    </div>
</main>
    <script src="script.js"></script>
</body>
</html>
